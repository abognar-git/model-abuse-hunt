<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 532" width="880" height="532" role="img" aria-label="Adaptive adversary across four attackers"><rect width="880" height="532" rx="10" fill="#0e1117"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">An adaptive attacker that may only rewrite text cannot win</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">four attackers spanning aligned, uncensored, reasoning and API models · each sees the pipeline's exact response and revises</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">data/attacker_matrix.json · python -m scripts.stress_adaptive --attackers … --reps 3</text><rect x="24.0" y="104.0" width="832.0" height="68.0" rx="8" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80"/><text x="40" y="128" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="start">PHASE A — PROSE ONLY</text><text x="40" y="149" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">0 of 4 attackers evaded in 8 rounds each. The behavioral risk score stayed invariant at 0.358 in every round of every run:</text><text x="40" y="165" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">prose is not an input to any signal. The attacker is optimising against a surface that does not decide.</text><text x="840" y="145" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="end">0/4</text><text x="24" y="204" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">PHASE B — WITH AN INFRASTRUCTURE BUDGET</text><text x="856" y="204" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">filled = true evasion (never investigated)</text><text x="24" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">gpt-4o-mini</text><rect x="250.0" y="224.0" width="26.0" height="26.0" rx="5" fill="#f87171" fill-opacity="0.9" stroke="#2a3242"/><rect x="282.0" y="224.0" width="26.0" height="26.0" rx="5" fill="#f87171" fill-opacity="0.9" stroke="#2a3242"/><rect x="314.0" y="224.0" width="26.0" height="26.0" rx="5" fill="#f87171" fill-opacity="0.9" stroke="#2a3242"/><text x="362" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">3/3</text><text x="418" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">cheapest $101  ·  found the $101 basket 3/3</text><text x="24" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">deepseek-r1:8b</text><rect x="250.0" y="274.0" width="26.0" height="26.0" rx="5" fill="#f87171" fill-opacity="0.9" stroke="#2a3242"/><rect x="282.0" y="274.0" width="26.0" height="26.0" rx="5" fill="#fbbf24" fill-opacity="0.45" stroke="#2a3242"/><rect x="314.0" y="274.0" width="26.0" height="26.0" rx="5" fill="#fbbf24" fill-opacity="0.45" stroke="#2a3242"/><text x="362" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">1/3</text><text x="418" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">cheapest $200  ·  found the $101 basket 0/3  ·  2 downgraded</text><text x="24" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">llama3.1:8b</text><rect x="250.0" y="324.0" width="26.0" height="26.0" rx="5" fill="#f87171" fill-opacity="0.9" stroke="#2a3242"/><rect x="282.0" y="324.0" width="26.0" height="26.0" rx="5" fill="#fbbf24" fill-opacity="0.45" stroke="#2a3242"/><rect x="314.0" y="324.0" width="26.0" height="26.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><text x="362" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">1/3</text><text x="418" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">cheapest $101  ·  found the $101 basket 1/3  ·  1 downgraded</text><text x="24" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#fbbf24" fill-opacity="1" text-anchor="start">abliterated twin</text><text x="24" y="404" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">same weights, refusals removed</text><rect x="250.0" y="374.0" width="26.0" height="26.0" rx="5" fill="#f87171" fill-opacity="0.9" stroke="#2a3242"/><rect x="282.0" y="374.0" width="26.0" height="26.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><rect x="314.0" y="374.0" width="26.0" height="26.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><text x="362" y="392" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">1/3</text><text x="418" y="392" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">cheapest $101  ·  found the $101 basket 1/3</text><text x="24" y="438" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">Given a budget the funded attacker does evade — detection is a toll, not a wall.</text><text x="24" y="458" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">But the toll is paid in infrastructure, which is exactly what the score is built on. The cheapest true evasion, $101, is the same basket the</text><text x="24" y="476" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">forced-purchase control and the exhaustive cost frontier both found independently.</text><rect x="24.0" y="492.0" width="832.0" height="46.0" rx="6" fill="#4ade80" fill-opacity="0.10" stroke="#4ade80"/><text x="38" y="511" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="start">Abliteration is a clean null: the twin with refusal training removed matched its parent exactly, 1/3 and 1/3.</text><text x="38" y="528" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">What separates attackers is whether they find the priced optimum -- search, not willingness.</text></svg>
