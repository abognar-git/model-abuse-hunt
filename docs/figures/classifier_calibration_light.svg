<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="classifier calibration on ToxicChat"><rect width="880" height="330" rx="10" fill="#ffffff"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="start">Keyword classifiers miss almost every real jailbreak</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">This repo's regex (src/classify.py) over 10,165 real ToxicChat prompts with human labels — the evasive-actor archetype, measured not asserted.</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">read from data/calibration/confusion.json (scripts/calibrate_classifier.py)</text><text x="24" y="108" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#9a6700" fill-opacity="1" text-anchor="start">the phrasing evasion the actor_evasive archetype is calibrated to — 93.6% here</text><text x="288" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="end">jailbreak under-read</text><text x="288" y="179" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="end">191/204 read benign</text><rect x="300.0" y="150.0" width="480.0" height="24.0" rx="4" fill="#d1d9e0" fill-opacity="0.5"/><rect x="300.0" y="150.0" width="449.4" height="24.0" rx="4" fill="#cf222e" fill-opacity="0.9"/><text x="741.424" y="167" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="end">93.6%</text><text x="70" y="250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0969da" fill-opacity="1" text-anchor="start">1.9%</text><text x="70" y="270" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">regex fires offensive</text><text x="340" y="250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#59636e" fill-opacity="1" text-anchor="start">7.3%</text><text x="340" y="270" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">toxic prevalence</text><text x="610" y="250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#59636e" fill-opacity="1" text-anchor="start">2.0%</text><text x="610" y="270" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">jailbreak prevalence</text></svg>
