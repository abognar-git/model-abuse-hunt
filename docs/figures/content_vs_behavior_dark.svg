<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 648" width="880" height="648" role="img" aria-label="Content versus behavior scoring"><rect width="880" height="648" rx="10" fill="#0e1117"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">Content cannot separate them. Behavior can.</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">23 accounts: 9 in a planted actor, 14 legitimate (8 of them deliberate content look-alikes). Topic is weighted 0.06; behavior and infrastructure are 0.94.</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">scored live through src.signals at figure-build time</text><text x="24" y="120" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#93a0b4" fill-opacity="1" text-anchor="start">IF THE SCORE WERE THE TOPIC</text><rect x="221.0" y="190.0" width="74.0" height="72.0" rx="4" fill="#4ade80" fill-opacity="0.85"/><rect x="221.0" y="190.0" width="74.0" height="0.0" rx="4" fill="#f87171" fill-opacity="0.9"/><text x="258.0" y="178.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="middle">9 accounts</text><text x="305.0" y="206.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="start">9 legitimate</text><text x="258.0" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.000</text><rect x="437.0" y="262.0" width="74.0" height="0.0" rx="4" fill="#4ade80" fill-opacity="0.85"/><rect x="437.0" y="254.0" width="74.0" height="8.0" rx="4" fill="#f87171" fill-opacity="0.9"/><text x="474.0" y="242.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="middle">1 account</text><text x="521.0" y="270.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">1 actor</text><text x="474.0" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.030</text><rect x="653.0" y="222.0" width="74.0" height="40.0" rx="4" fill="#4ade80" fill-opacity="0.85"/><rect x="653.0" y="158.0" width="74.0" height="64.0" rx="4" fill="#f87171" fill-opacity="0.9"/><text x="690.0" y="146.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="middle">13 accounts</text><text x="737.0" y="174.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">8 actors</text><text x="737.0" y="189.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="start">5 legitimate</text><text x="690.0" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.060</text><line x1="150.0" y1="262.0" x2="838.0" y2="262.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="24" y="314" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">13 accounts share the identical content score 0.060 — 8 actors and 5 legitimate users.</text><text x="24" y="333" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">The pentester, the awareness trainer, the CTF student and the journalist are asking the actors' questions, word for word.</text><text x="24" y="372" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#93a0b4" fill-opacity="1" text-anchor="start">THE SCORE AS BUILT (BEHAVIOR + INFRASTRUCTURE)</text><line x1="150.0" y1="452.0" x2="838.0" y2="452.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><line x1="150.0" y1="452.0" x2="150.0" y2="457.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="150.0" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.0</text><line x1="287.6" y1="452.0" x2="287.6" y2="457.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="287.6" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.1</text><line x1="425.2" y1="452.0" x2="425.2" y2="457.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="425.2" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.2</text><line x1="562.8" y1="452.0" x2="562.8" y2="457.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="562.8" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.3</text><line x1="700.4" y1="452.0" x2="700.4" y2="457.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="700.4" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.4</text><line x1="838.0" y1="452.0" x2="838.0" y2="457.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="838.0" y="471" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.5</text><line x1="494.0" y1="374.0" x2="494.0" y2="560.0" stroke="#60a5fa" stroke-width="1.6" stroke-opacity="1" stroke-dasharray="5 4"/><text x="502.0" y="386" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#60a5fa" fill-opacity="1" text-anchor="start">lead line 0.25</text><text x="502.0" y="400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#60a5fa" fill-opacity="0.85" text-anchor="start">at/above = a queue entry</text><circle cx="810.5" cy="442.0" r="4.6" fill="#f87171" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="675.6" cy="442.0" r="4.6" fill="#f87171" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="643.0" cy="442.0" r="4.6" fill="#f87171" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="599.5" cy="442.0" r="4.6" fill="#f87171" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="599.5" cy="431.0" r="4.6" fill="#f87171" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="599.5" cy="420.0" r="4.6" fill="#f87171" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="599.5" cy="409.0" r="4.6" fill="#f87171" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="514.6" cy="484.0" r="4.6" fill="#4ade80" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="507.8" cy="442.0" r="4.6" fill="#f87171" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="491.7" cy="442.0" r="4.6" fill