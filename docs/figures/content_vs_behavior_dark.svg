UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="start">One legitimate account crosses the line: the detection engineer at 0.265, behaviorally identical to a malware author.</text><text x="24" y="599" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">A lead is not an accusation. It is cleared downstream — by the policy layer, not by the model getting it right.</text><text x="24" y="632" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="start">The one metric that matters: 0 of 14 legitimate accounts ever reached an enforce decision.</text></svg>
