<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512" width="880" height="512" role="img" aria-label="Detection cost frontier"><rect width="880" height="512" rx="10" fill="#ffffff"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="start">What does it cost to disappear?</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">all 64 countermeasure baskets enumerated against each actor · two bought out for ~$100, two unbuyable at any price</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">data/cost_frontier.json · offline enumeration, python -m scripts.cost_frontier</text><rect x="24.0" y="132.0" width="832.0" height="62.0" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0"/><rect x="24.0" y="132.0" width="4.0" height="62.0" rx="2" fill="#cf222e" fill-opacity="1"/><text x="44" y="158" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="start">recon automation</text><text x="44" y="177" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">1 account · baseline risk 0.480</text><text x="300" y="158" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#cf222e" fill-opacity="1" text-anchor="start">BOUGHT OUT</text><text x="300" y="177" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">jitter cadence + split infrastructure</text><text x="836" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" fill="#cf222e" fill-opacity="1" text-anchor="end">$100</text><rect x="24.0" y="206.0" width="832.0" height="62.0" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0"/><rect x="24.0" y="206.0" width="4.0" height="62.0" rx="2" fill="#cf222e" fill-opacity="1"/><text x="44" y="232" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="start">capability dev</text><text x="44" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">2 accounts · baseline risk 0.358</text><text x="300" y="232" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#cf222e" fill-opacity="1" text-anchor="start">BOUGHT OUT</text><text x="300" y="251" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">clean asn + verified payment + phone verified</text><text x="836" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" fill="#cf222e" fill-opacity="1" text-anchor="end">$101</text><rect x="24.0" y="280.0" width="832.0" height="62.0" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0"/><rect x="24.0" y="280.0" width="4.0" height="62.0" rx="2" fill="#1a7f37" fill-opacity="1"/><text x="44" y="306" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="start">lure factory</text><text x="44" y="325" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">5 accounts · baseline risk 0.327</text><text x="300" y="306" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1a7f37" fill-opacity="1" text-anchor="start">UNBUYABLE AT ANY PRICE</text><text x="300" y="325" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">still attributed to a cluster (shared victims + shared behavior)</text><text x="836" y="314" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1a7f37" fill-opacity="1" text-anchor="end">∞</text><rect x="24.0" y="354.0" width="832.0" height="62.0" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0"/><rect x="24.0" y="354.0" width="4.0" height="62.0" rx="2" fill="#1a7f37" fill-opacity="1"/><text x="44" y="380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="start">stolen key</text><text x="44" y="399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">1 account · baseline risk 0.382</text><text x="300" y="380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1a7f37" fill-opacity="1" text-anchor="start">UNBUYABLE AT ANY PRICE</text><text x="300" y="399" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">risk floor 0.282 stays above the 0.25 lead line</text><text x="836" y="388" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1a7f37" fill-opacity="1" text-anchor="end">∞</text><text x="24" y="450" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2328" fill-opacity="1" text-anchor="start">The two unbuyable actors are unbuyable for the same reason: their exposure is the operation itself, not how it is provisioned.</text><text x="24" y="470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">Breaking the lure factory's attribution would mean ceasing to attack the same victims. Clearing the stolen key's drift would mean changing its own past.</text><text x="24" y="494" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#59636e" fill-opacity="1" text-anchor="start">Prices are order-of-magnitude figures for commodity proxy/card/SMS services, not quotes. Only the ordering and the per-account scaling carry weight.</text></svg>
