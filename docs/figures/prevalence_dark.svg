#e6ebf2" fill-opacity="1" text-anchor="start">The shaded area is</text><text x="664" y="254" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">everything 14 benign</text><text x="664" y="270" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">accounts cannot tell</text><text x="664" y="286" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">apart.</text><text x="664" y="318" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">To rule it out you</text><text x="664" y="334" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">need 30,000 clean</text><text x="664" y="350" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">benign accounts, not</text><text x="664" y="366" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">14.</text><text x="24" y="456" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">Against a rare event the queue's composition is set by the false-positive rate times the benign population, not by recall.</text><text x="24" y="474" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">No model improvement changes that term — which is the arithmetic case for policy rule 1:</text><text x="24" y="492" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">enforcement is a queue for a human, never a switch.</text></svg>
