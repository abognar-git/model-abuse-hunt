<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" role="img" aria-label="Fragmentation versus attribution"><rect width="880" height="396" rx="10" fill="#0e1117"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">Coordination survives what per-account scoring cannot</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">an operation fragmented across 8 single-session burners · none individually clears the lead line</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">python -m scripts.stress_attribution (EXP-3) · offline and deterministic</text><line x1="130.0" y1="210.0" x2="720.0" y2="210.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><line x1="150.0" y1="210.0" x2="150.0" y2="215.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="150.0" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.0</text><line x1="260.0" y1="210.0" x2="260.0" y2="215.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="260.0" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.1</text><line x1="370.0" y1="210.0" x2="370.0" y2="215.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="370.0" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.2</text><line x1="480.0" y1="210.0" x2="480.0" y2="215.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="480.0" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.3</text><line x1="590.0" y1="210.0" x2="590.0" y2="215.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="590.0" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.4</text><line x1="700.0" y1="210.0" x2="700.0" y2="215.0" stroke="#2a3242" stroke-width="1" stroke-opacity="1"/><text x="700.0" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.5</text><line x1="425.0" y1="114.0" x2="425.0" y2="218.0" stroke="#60a5fa" stroke-width="1.6" stroke-opacity="1" stroke-dasharray="5 4"/><text x="433.0" y="124" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#60a5fa" fill-opacity="1" text-anchor="start">lead line 0.25</text><text x="24" y="128" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#93a0b4" fill-opacity="1" text-anchor="start">PER-ACCOUNT SCORING</text><circle cx="183.0" cy="190.0" r="5.5" fill="#93a0b4" fill-opacity="0.9" stroke="#0e1117" stroke-width="1.2"/><circle cx="197.1" cy="190.0" r="5.5" fill="#93a0b4" fill-opacity="0.9" stroke="#0e1117" stroke-width="1.2"/><circle cx="211.3" cy="190.0" r="5.5" fill="#93a0b4" fill-opacity="0.9" stroke="#0e1117" stroke-width="1.2"/><circle cx="225.4" cy="190.0" r="5.5" fill="#93a0b4" fill-opacity="0.9" stroke="#0e1117" stroke-width="1.2"/><circle cx="239.6" cy="190.0" r="5.5" fill="#93a0b4" fill-opacity="0.9" stroke="#0e1117" stroke-width="1.2"/><circle cx="253.7" cy="190.0" r="5.5" fill="#93a0b4" fill-opacity="0.9" stroke="#0e1117" stroke-width="1.2"/><circle cx="267.9" cy="190.0" r="5.5" fill="#93a0b4" fill-opacity="0.9" stroke="#0e1117" stroke-width="1.2"/><circle cx="282.0" cy="190.0" r="5.5" fill="#93a0b4" fill-opacity="0.9" stroke="#0e1117" stroke-width="1.2"/><text x="177.0" y="168" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">8 burners · each risk ≤ 0.12 · 0 leads</text><text x="24" y="268" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#93a0b4" fill-opacity="1" text-anchor="start">ATTRIBUTION</text><rect x="150.0" y="280.0" width="300.0" height="46.0" rx="8" fill="#f87171" fill-opacity="0.16" stroke="#f87171"/><text x="166" y="300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">1 actor</text><text x="166" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">all 8 of 8 reassembled</text><text x="474" y="300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">linked on shared infrastructure + victim,</text><text x="474" y="318" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">never on topic and never on a bare IP match</text><text x="24" y="356" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">Scoring is evadable. Coordination costs the attacker scale — which is why attribution, not the per-account score, is the load-bearing layer.</text><text x="24" y="378" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">Residual gap, stated: the one decomposition burner that also changed its topic slipped the infrastructure-only link.</text></svg>
