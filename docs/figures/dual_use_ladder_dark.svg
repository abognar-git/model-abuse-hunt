<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 532" width="880" height="532" role="img" aria-label="Dual-use separation across the model ladder"><rect width="880" height="532" rx="10" fill="#0e1117"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">A prediction of mine that the model ladder refuted</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">matched dual-use pairs, 9 trials per model · red = the model gave the actor and the legitimate twin the SAME label</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">data/dual_use_ladder.json · python -m scripts.stress_dual_use --models all --reps 3</text><text x="24" y="128" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#93a0b4" fill-opacity="1" text-anchor="start">MODEL</text><text x="236" y="128" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#93a0b4" fill-opacity="1" text-anchor="start">SAME LABEL FOR BOTH TWINS (of 9)</text><text x="836" y="128" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#93a0b4" fill-opacity="1" text-anchor="end">LEGIT TWIN ENFORCED</text><text x="24" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">gpt-4o-mini</text><text x="24" y="187" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">4o · mini</text><rect x="236.0" y="160.0" width="420.0" height="22.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><rect x="236.0" y="160.0" width="140.0" height="22.0" rx="5" fill="#f87171" fill-opacity="0.9"/><text x="386.0" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#f87171" fill-opacity="1" text-anchor="start">3/9</text><text x="836" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="end">0/9</text><text x="24" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">gpt-4.1-mini</text><text x="24" y="233" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">4.1 · mini</text><rect x="236.0" y="206.0" width="420.0" height="22.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><text x="248" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#4ade80" fill-opacity="1" text-anchor="start">0/9  separated every time</text><text x="836" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="end">0/9</text><text x="24" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">gpt-5-mini</text><text x="24" y="279" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">5 · mini</text><rect x="236.0" y="252.0" width="420.0" height="22.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><text x="248" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#4ade80" fill-opacity="1" text-anchor="start">0/9  separated every time</text><text x="836" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="end">0/9</text><text x="24" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">gpt-5.4-mini</text><text x="24" y="325" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">5.4 · mini</text><rect x="236.0" y="298.0" width="420.0" height="22.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><text x="248" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#4ade80" fill-opacity="1" text-anchor="start">0/9  separated every time</text><text x="836" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="end">0/9</text><text x="24" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">gpt-5.6-terra</text><text x="24" y="371" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">frontier</text><rect x="236.0" y="344.0" width="420.0" height="22.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><text x="248" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#4ade80" fill-opacity="1" text-anchor="start">0/9  separated every time</text><text x="836" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="end">0/9</text><text x="24" y="402" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">o4-mini</text><text x="24" y="417" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">reasoning</text><rect x="236.0" y="390.0" width="420.0" height="22.0" rx="5" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><text x="248" y="406" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="400" fill="#4ade80" fill-opacity="1" text-anchor="start">0/9  separated every time</text><text x="836" y="406" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="end">0/9</text><text x="24" y="454" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">I expected separation NOT to improve with capability. It did.</text><text x="24" y="474" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">The honest reading is narrower than the result looks: the evidence packet already held the discriminating behavioral facts, and better models used them.</text><text x="24" y="492" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">Capability improved the reading of available evidence, not the supply of missing evidence.</text><rect x="24.0" y="506.0" width="832.0" height="30.0" rx="6" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80"/><text x="38" y="526" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#4ade80" fill-opacity="1" text-anchor="start">And the thing that never moved: 0 legitimate twins enforced, on every model. That is the policy layer, not the model.</text></svg>
