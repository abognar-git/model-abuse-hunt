<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="prevalence vs precision"><rect width="880" height="440" rx="10" fill="#0e1117"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">At a realistic abuse rate the queue is mostly innocent people</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">Precision of the lead queue vs platform prevalence (log scale). The fixture ran at 39%; a real platform is far rarer.</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">scored live through src.signals at figure-build time</text><line x1="95.0" y1="360.0" x2="800.0" y2="360.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.5"/><text x="85" y="364.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">0%</text><line x1="95.0" y1="307.5" x2="800.0" y2="307.5" stroke="#2a3242" stroke-width="1" stroke-opacity="0.5"/><text x="85" y="311.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">25%</text><line x1="95.0" y1="255.0" x2="800.0" y2="255.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.5"/><text x="85" y="259.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">50%</text><line x1="95.0" y1="202.5" x2="800.0" y2="202.5" stroke="#2a3242" stroke-width="1" stroke-opacity="0.5"/><text x="85" y="206.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">75%</text><line x1="95.0" y1="150.0" x2="800.0" y2="150.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.5"/><text x="85" y="154.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">100%</text><text x="800.0" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">39%</text><text x="691.9322529011916" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">20%</text><text x="579.7675933533392" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">10%</text><text x="467.6029338054869" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">5%</text><text x="319.3293190957048" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">2.0%</text><text x="207.1646595478524" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">1.0%</text><text x="95.0" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">0.5%</text><text x="447.5" y="398" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">platform abuse prevalence (fraction of accounts that are actors)</text><polyline points="800.0,207.4 691.9,254.0 579.8,294.2 467.6,321.5 319.3,343.8 207.2,350.6 95.0,356.8" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linejoin="round"/><circle cx="800.0" cy="207.4" r="3.8" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="691.9" cy="254.0" r="3.8" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="579.8" cy="294.2" r="3.8" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="467.6" cy="321.5" r="3.8" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="319.3" cy="343.8" r="3.8" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="207.2" cy="350.6" r="3.8" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><circle cx="95.0" cy="356.8" r="3.8" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><line x1="319.3" y1="140.0" x2="319.3" y2="360.0" stroke="#fbbf24" stroke-width="1.3" stroke-opacity="1" stroke-dasharray="5 4"/><text x="319.3293190957048" y="134" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#fbbf24" fill-opacity="1" text-anchor="middle">reported 2%</text><text x="24" y="108" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" fill-opacity="1" text-anchor="start">at 2% prevalence the queue is 92% innocent — the whole argument for a human gate</text><circle cx="100.0" cy="414.0" r="5" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><text x="111" y="418" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">queue precision (PPV)</text></svg>
