<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="threshold sweep"><rect width="880" height="470" rx="10" fill="#0e1117"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">Raising the line cleans the queue; it never finds the evaders</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">Every threshold on the 400-account population: false accusations collapse as the line rises, but the actors caught never climb.</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">scored live through src.signals at figure-build time</text><text x="24" y="108" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24" fill-opacity="1" text-anchor="start">at 0.45 the false-accusation rate falls from ~15% to under 1% while the same 5 of 8 actors are caught</text><line x1="90.0" y1="380.0" x2="800.0" y2="380.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.5"/><text x="80" y="384.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">0%</text><line x1="90.0" y1="322.5" x2="800.0" y2="322.5" stroke="#2a3242" stroke-width="1" stroke-opacity="0.5"/><text x="80" y="326.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">25%</text><line x1="90.0" y1="265.0" x2="800.0" y2="265.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.5"/><text x="80" y="269.0" font-family="ui-monospace,SFMono-Regular,Menlo,mono