<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Calibration of the ICD-203 bands"><rect width="880" height="470" rx="10" fill="#0e1117"/><text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">Is the confidence language honest?</text><text x="24" y="62" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">ICD-203 bands scored against ground truth · Brier 0.070 (reliability 0.041, resolution 0.209)</text><text x="24" y="80" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">src.calibration --model gpt-4o-mini --reps 1 · measured 2026-07-29</text><rect x="150.0" y="118.0" width="260.0" height="260.0" rx="6" fill="#171c26" fill-opacity="1" stroke="#2a3242"/><line x1="150.0" y1="313.0" x2="410.0" y2="313.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.6"/><line x1="215.0" y1="118.0" x2="215.0" y2="378.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.6"/><line x1="150.0" y1="248.0" x2="410.0" y2="248.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.6"/><line x1="280.0" y1="118.0" x2="280.0" y2="378.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.6"/><line x1="150.0" y1="183.0" x2="410.0" y2="183.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.6"/><line x1="345.0" y1="118.0" x2="345.0" y2="378.0" stroke="#2a3242" stroke-width="1" stroke-opacity="0.6"/><line x1="150.0" y1="378.0" x2="410.0" y2="118.0" stroke="#93a0b4" stroke-width="1.4" stroke-opacity="1" stroke-dasharray="4 4"/><text x="259.2" y="250.8" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">perfect calibration</text><line x1="176.0" y1="352.0" x2="176.0" y2="378.0" stroke="#60a5fa" stroke-width="1.6" stroke-opacity="1" stroke-dasharray="3 3"/><circle cx="176.0" cy="378.0" r="5.5" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><text x="186.0" y="358.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">very unlikely  n=9</text><text x="186.0" y="373.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#60a5fa" fill-opacity="1" text-anchor="start">-0.10</text><line x1="228.0" y1="300.0" x2="228.0" y2="378.0" stroke="#60a5fa" stroke-width="1.6" stroke-opacity="1" stroke-dasharray="3 3"/><circle cx="228.0" cy="378.0" r="5.5" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><text x="238.0" y="332.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">unlikely  n=3</text><text x="238.0" y="347.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#60a5fa" fill-opacity="1" text-anchor="start">-0.30</text><line x1="332.0" y1="196.0" x2="332.0" y2="292.2" stroke="#fbbf24" stroke-width="1.6" stroke-opacity="1" stroke-dasharray="3 3"/><circle cx="332.0" cy="292.2" r="7" fill="#fbbf24" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><text x="350.0" y="296.2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">likely  n=3</text><text x="350.0" y="311.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="start">-0.37</text><line x1="371.0" y1="157.0" x2="371.0" y2="118.0" stroke="#60a5fa" stroke-width="1.6" stroke-opacity="1" stroke-dasharray="3 3"/><circle cx="371.0" cy="118.0" r="5.5" fill="#60a5fa" fill-opacity="1" stroke="#0e1117" stroke-width="1.2"/><text x="355.0" y="138.0" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="end">very likely  n=8</text><text x="355.0" y="153.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#60a5fa" fill-opacity="1" text-anchor="end">+0.15</text><text x="280.0" y="412" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="middle">band's nominal probability</text><text x="116" y="248.0" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#93a0b4" text-anchor="middle" transform="rotate(-90 116 248.0)">empirical P(malicious)</text><text x="470" y="134" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">The extremes are honest.</text><text x="470" y="156" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">“very unlikely” → 0.00 empirical.</text><text x="470" y="174" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">“very likely” → 1.00: righter than it claimed.</text><text x="470" y="214" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fbbf24" fill-opacity="1" text-anchor="start">The middle is not.</text><text x="470" y="236" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">“likely” is overconfident by 0.37 —</text><text x="470" y="254" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">and “likely” is the exact confidence</text><text x="470" y="272" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">floor src/policy.py gates adverse</text><text x="470" y="290" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">action on.</text><text x="470" y="324" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">The band the enforcement</text><text x="470" y="342" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">gate rests on is the least</text><text x="470" y="360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e6ebf2" fill-opacity="1" text-anchor="start">reliable one in the set.</text><text x="24" y="454" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#93a0b4" fill-opacity="1" text-anchor="start">n=3 in that cell — thin, and it is the cell that matters most, which argues for measuring it on real traffic rather than ignoring it.</text></svg>
