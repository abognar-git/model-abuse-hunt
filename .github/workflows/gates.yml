name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only, self-contained on a fresh clone. Text only by design:
      # the committed figures still need an eyeball pass after any
      # identifier change (four of this family's six shipped incidents
      # were image-borne).
      - name: identifier hygiene
        run: python3 -m scripts.check_identifiers
      # The label-cost finding is only honest if the scorer is identical
      # across the oracle and predicted runs; this holds that line.
      - name: scorer unmodified
        run: python3 scripts/check_scorer_unmodified.py
      # Both gates above guard the data. Nothing guarded the prose, and the
      # prose is where the claims are read: four counts had drifted off the
      # artifacts they describe, one of them into a sibling repo that took
      # its framing from here. Every number this checks is re-derived from
      # data/ or scripts/, never from a second copy of the sentence.
      - name: README matches the artifacts
        run: python3 scripts/check_readme.py
